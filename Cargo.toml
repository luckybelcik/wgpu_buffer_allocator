cargo-features = ["profile-rustflags"]

[package]
name = "ssbo-allocator"
version = "1.0.0"
edition = "2024"

[dependencies]
futures-intrusive = "0.5.0"
pollster = "0.4.0"
rand = "0.9.2"
wgpu = "27.0.1"

[profile.dev]
strip = "debuginfo"
rustflags = ["-Z", "threads=8", "-C", "link-arg=-no-pie"]
codegen-units = 512
incremental = true
opt-level = 0

cargo-features = ["profile-rustflags"]

[package]
name = "wgpu_buffer_allocator"
version = "0.1.0"
edition = "2024"
authors = ["luckybelcik"]
description = "A compact GPU memory allocator abstraction for wgpu."
license = "MIT"
readme = "README.md"
repository = "https://github.com/luckybelcik/wgpu_buffer_allocator/"

[dependencies]
futures-intrusive = "0.5.0"
pollster = "0.4.0"
rand = "0.9.2"
wgpu = "27.0.1"

[profile.dev]
strip = "debuginfo"
rustflags = ["-Z", "threads=8", "-C", "link-arg=-no-pie"]
codegen-units = 512
incremental = true
opt-level = 0
